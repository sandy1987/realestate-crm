openapi: 3.1.0
info:
  title: AGENT-Broker Real Estate CRM Backend API
  version: 1.0.0
  description: >
    Production-grade multi-tenant backend API for real estate CRM operations,
    featuring strict firm isolation, RBAC, plot and colony management,
    confidential owner/source privacy separation, and structured audit logs.
servers:
  - url: http://localhost:5000
    description: Local development server

paths:
  /health:
    get:
      summary: Process Liveness Probe
      description: Returns 200 when the Node.js process is active.
      tags: [Health]
      responses:
        '200':
          description: Process is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /health/ready:
    get:
      summary: Database Readiness Probe
      description: Returns 200 when MongoDB Atlas / memory connection is connected.
      tags: [Health]
      responses:
        '200':
          description: Database is connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessSuccessResponse'
        '503':
          description: Database is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      summary: User Login
      description: Authenticates user credentials using Argon2id and returns access and refresh tokens.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/auth/refresh:
    post:
      summary: Rotate Refresh Token
      description: Atomically claims and rotates an active refresh token, issuing a new token pair.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      summary: User Logout
      description: Revokes the specified refresh token session.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/me:
    get:
      summary: Authenticated Profile Identity
      description: Returns safe user object for current authenticated user.
      security:
        - BearerAuth: []
      tags: [Authentication]
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/change-password:
    post:
      summary: Change Password
      description: Changes user password and revokes all active refresh-token sessions.
      security:
        - BearerAuth: []
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/platform/firms:
    post:
      summary: Provision Tenant Firm
      description: Provisions a new firm organization and optional initial FIRM_ADMIN. (SUPER_ADMIN only)
      security:
        - BearerAuth: []
      tags: [Platform Administration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFirmRequest'
      responses:
        '201':
          description: Firm created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFirmResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      summary: List Tenant Firms
      description: Lists all provisioned firms with pagination. (SUPER_ADMIN only)
      security:
        - BearerAuth: []
      tags: [Platform Administration]
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/SortByQuery'
        - $ref: '#/components/parameters/SortOrderQuery'
        - name: search
          in: query
          schema:
            type: string
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: List of firms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirmListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/platform/firms/{firmId}:
    get:
      summary: Get Firm Details
      description: Retrieves firm record by ID. (SUPER_ADMIN only)
      security:
        - BearerAuth: []
      tags: [Platform Administration]
      parameters:
        - name: firmId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Firm details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirmSingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/platform/firms/{firmId}/suspend:
    post:
      summary: Suspend Tenant Firm
      description: Suspends a firm and immediately revokes all member token sessions. (SUPER_ADMIN only)
      security:
        - BearerAuth: []
      tags: [Platform Administration]
      parameters:
        - name: firmId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Firm suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirmSingleResponse'

  /api/v1/platform/firms/{firmId}/activate:
    post:
      summary: Activate Tenant Firm
      description: Activates a suspended firm. (SUPER_ADMIN only)
      security:
        - BearerAuth: []
      tags: [Platform Administration]
      parameters:
        - name: firmId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Firm activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirmSingleResponse'

  /api/v1/platform/audit:
    get:
      summary: Platform Audit Trail
      description: Query platform and tenant audit records across the system. (SUPER_ADMIN only)
      security:
        - BearerAuth: []
      tags: [Platform Administration]
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: eventType
          in: query
          schema:
            type: string
        - name: firmId
          in: query
          schema:
            type: string
        - name: platformOnly
          in: query
          schema:
            type: boolean
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Paginated audit logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/firm/me:
    get:
      summary: Get Own Firm Profile
      description: Returns organization details for the authenticated tenant user.
      security:
        - BearerAuth: []
      tags: [Firm Operations]
      responses:
        '200':
          description: Firm profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirmSingleResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/firm/audit:
    get:
      summary: Query Firm Audit Trail
      description: Retrieves audit records strictly scoped to caller firm. (FIRM_ADMIN or staff with audit:read)
      security:
        - BearerAuth: []
      tags: [Firm Operations]
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: eventType
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Paginated firm audit logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/firm/users:
    post:
      summary: Create Staff User
      description: Creates a new staff member account under caller's firm. (FIRM_ADMIN only)
      security:
        - BearerAuth: []
      tags: [Firm User Administration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      summary: List Firm Users
      description: Paginated listing of users strictly within caller's firm. (FIRM_ADMIN only)
      security:
        - BearerAuth: []
      tags: [Firm User Administration]
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: search
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
            enum: [FIRM_ADMIN, FIRM_STAFF]
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: List of firm users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'

  /api/v1/firm/users/{userId}:
    get:
      summary: Get Firm User by ID
      description: Retrieves a single user within the firm. (FIRM_ADMIN only)
      security:
        - BearerAuth: []
      tags: [Firm User Administration]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update Firm User
      description: Updates profile and permission assignments for a firm staff member. (FIRM_ADMIN only)
      security:
        - BearerAuth: []
      tags: [Firm User Administration]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /api/v1/firm/users/{userId}/status:
    patch:
      summary: Update User Status (Activate/Suspend)
      description: Activates or suspends a firm user and revokes active sessions. (FIRM_ADMIN only)
      security:
        - BearerAuth: []
      tags: [Firm User Administration]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: User status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/v1/colonies:
    post:
      summary: Create Colony
      description: Creates a new township/colony under caller's firm. (Requires colonies:write)
      security:
        - BearerAuth: []
      tags: [Colonies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateColonyRequest'
      responses:
        '201':
          description: Colony created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColonySingleResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      summary: List Colonies
      description: Paginated search and list of colonies within caller's firm. (Requires colonies:read)
      security:
        - BearerAuth: []
      tags: [Colonies]
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: search
          in: query
          schema:
            type: string
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: List of colonies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColonyListResponse'

  /api/v1/colonies/{colonyId}:
    get:
      summary: Get Colony by ID
      description: Retrieves a single colony record. (Requires colonies:read)
      security:
        - BearerAuth: []
      tags: [Colonies]
      parameters:
        - name: colonyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Colony details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColonySingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update Colony
      description: Updates colony metadata. (Requires colonies:write)
      security:
        - BearerAuth: []
      tags: [Colonies]
      parameters:
        - name: colonyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateColonyRequest'
      responses:
        '200':
          description: Updated colony
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColonySingleResponse'
    delete:
      summary: Deactivate Colony
      description: Soft deletes a colony (isActive = false). (Requires colonies:write)
      security:
        - BearerAuth: []
      tags: [Colonies]
      parameters:
        - name: colonyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Colony deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColonySingleResponse'

  /api/v1/plots:
    post:
      summary: Create Plot
      description: Creates a plot record with size, pricing, and video links. (Requires plots:write)
      security:
        - BearerAuth: []
      tags: [Plots]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlotRequest'
      responses:
        '201':
          description: Plot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlotSingleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      summary: List & Search Plots
      description: Paginated search, filtering by colony, price, size, and status. (Requires plots:read)
      security:
        - BearerAuth: []
      tags: [Plots]
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: search
          in: query
          schema:
            type: string
        - name: colonyId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [available, reserved, sold, blocked]
        - name: type
          in: query
          schema:
            type: string
            enum: [residential, commercial, industrial, agricultural, other]
        - name: sizeMin
          in: query
          schema:
            type: number
        - name: sizeMax
          in: query
          schema:
            type: number
        - name: priceMin
          in: query
          schema:
            type: number
        - name: priceMax
          in: query
          schema:
            type: number
      responses:
        '200':
          description: List of plots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlotListResponse'

  /api/v1/plots/{plotId}:
    get:
      summary: Get Plot by ID
      description: Retrieves public details for a single plot. (Requires plots:read)
      security:
        - BearerAuth: []
      tags: [Plots]
      parameters:
        - name: plotId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plot details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlotSingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update Plot
      description: Updates plot fields, video URL, or status. (Requires plots:write)
      security:
        - BearerAuth: []
      tags: [Plots]
      parameters:
        - name: plotId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlotRequest'
      responses:
        '200':
          description: Updated plot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlotSingleResponse'
    delete:
      summary: Deactivate Plot
      description: Soft deletes a plot (isActive = false). (Requires plots:delete)
      security:
        - BearerAuth: []
      tags: [Plots]
      parameters:
        - name: plotId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plot deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlotSingleResponse'

  /api/v1/plots/{plotId}/share-whatsapp:
    get:
      summary: Get Plot WhatsApp Share Details
      description: Generates formatted marketing details and universal WhatsApp Web & API URLs for a plot listing. (Requires plots:read)
      security:
        - BearerAuth: []
      tags: [Plots]
      parameters:
        - name: plotId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: WhatsApp share details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlotWhatsAppShareResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/plots/{plotId}/private:
    get:
      summary: Read Private Plot Data
      description: Retrieves confidential owner and source details. (Requires private:read)
      security:
        - BearerAuth: []
      tags: [Private Plot Data]
      parameters:
        - name: plotId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Private owner/source details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlotPrivateResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Upsert Private Plot Data
      description: Creates or completely replaces private owner and source records. (Requires private:write)
      security:
        - BearerAuth: []
      tags: [Private Plot Data]
      parameters:
        - name: plotId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutPlotPrivateRequest'
      responses:
        '200':
          description: Private record saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlotPrivateResponse'
    patch:
      summary: Partial Update Private Plot Data
      description: Partially updates private owner or source fields. (Requires private:write)
      security:
        - BearerAuth: []
      tags: [Private Plot Data]
      parameters:
        - name: plotId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchPlotPrivateRequest'
      responses:
        '200':
          description: Private record updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlotPrivateResponse'
    delete:
      summary: Delete Private Plot Data
      description: Permanently removes confidential owner/source record for a plot. (Requires private:write)
      security:
        - BearerAuth: []
      tags: [Private Plot Data]
      parameters:
        - name: plotId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Private data removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Standard JWT Bearer token authentication header

  parameters:
    PageQuery:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    LimitQuery:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    SortByQuery:
      name: sortBy
      in: query
      schema:
        type: string
    SortOrderQuery:
      name: sortOrder
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc

  responses:
    Unauthorized:
      description: Authentication is required or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Access forbidden for caller role or missing permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Uniqueness violation or state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Invalid request payload or query parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    HealthResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            status: { type: string, example: ok }
        timestamp: { type: string, format: date-time }

    ReadinessSuccessResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            status: { type: string, example: ok }
            database: { type: string, example: connected }
        timestamp: { type: string, format: date-time }

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string, example: Detailed error message }
            details: { type: object }
        timestamp: { type: string, format: date-time }

    SuccessMessageResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            message: { type: string, example: Operation completed successfully }
        timestamp: { type: string, format: date-time }

    PaginationMeta:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 45 }
        totalPages: { type: integer, example: 3 }
        hasNextPage: { type: boolean, example: true }
        hasPrevPage: { type: boolean, example: false }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: admin@apexrealestate.com }
        password: { type: string, format: password, example: StrongPassword123! }

    RefreshTokenRequest:
      type: object
